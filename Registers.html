<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Laundry Management System</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="/Authentication/register.css">

</head>

<body>

    <main class="auth-container">



        <section class="branding-panel">

            <div class="branding-content">

                <div class="logo-icon">
                    <i class="fa-solid fa-shirt"></i>
                </div>

                <h1>Laundry Management System</h1>

                <p>
                    Create your account and start managing your laundry
                    business professionally.
                </p>

            </div>

        </section>



        <section class="login-panel">

            <div class="login-card">

                <h2>Create Account</h2>

                <p class="subtitle">
                    Fill in your information below.
                </p>

                <form id="registerForm">


                    <div class="input-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input type="text" id="fullName" placeholder="Enter your full name">

                    </div>


                    <div class="input-group">

                        <label for="registerUsername">
                            Username
                        </label>

                        <input type="text" id="registerUsername" placeholder="Choose a username">

                    </div>


                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email" id="email" placeholder="Enter your email">

                    </div>


                    <div class="input-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input type="password" id="registerPassword" placeholder="Create a password">

                            <button type="button" class="toggle-password" id="toggleRegisterPassword">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input type="password" id="confirmPassword" placeholder="Confirm your password">

                            <button type="button" class="toggle-password" id="toggleConfirmPassword">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <button type="submit" class="login-btn">

                        Register

                    </button>

                </form>

                <div class="auth-links">

                    <p>

                        Already have an account?

                        <a href="login.html">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>


    <script src="Authentication/register.js"></script>

</body>

</html>
